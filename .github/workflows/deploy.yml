# Build the static export and publish it to Hostinger over FTP.
#
# One-time setup — GitHub repo → Settings → Secrets and variables → Actions:
#   FTP_SERVER    ftp.tradingnewsglobal.com   (hPanel → Files → FTP Accounts)
#   FTP_USERNAME  u123456789.deploy
#   FTP_PASSWORD  the FTP account password
#
# Hostinger serves from public_html/ — that is the server-dir below.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-deploy by hand from the Actions tab

concurrency:
  group: deploy-production
  # Deliberately NOT cancel-in-progress. Cancelling a run mid-FTP-transfer
  # leaves a partial upload and an inconsistent sync-state file on the server,
  # which then breaks the following deploy too. Queue instead, so every
  # transfer finishes before the next one starts.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://tradingnewsglobal.com
          # NEXT_PUBLIC_ADSENSE_CLIENT lives in .env.production — the publisher
          # ID is public by design, so it needs no secret.

      - name: Verify the export looks complete
        run: |
          for f in index.html sitemap.xml robots.txt .htaccess feed.xml llms.txt 404.html; do
            test -f "out/$f" || { echo "::error::missing out/$f"; exit 1; }
          done
          echo "Exported $(find out -name '*.html' | wc -l) HTML pages, $(du -sh out | cut -f1)"

          # ads.txt is machine-parsed by AdSense and by programmatic buyers.
          # A stray non-ASCII byte or a CRLF is an avoidable way to fail a parser.
          if LC_ALL=C grep -q '[^ -~]' out/ads.txt; then
            echo "::error::ads.txt contains non-ASCII bytes"; exit 1
          fi
          if grep -q $'
' out/ads.txt; then
            echo "::error::ads.txt has CRLF line endings, expected LF"; exit 1
          fi
          grep -qE '^google\.com, pub-[0-9]{16}, DIRECT, f08c47fec0942fa0$' out/ads.txt || {
            echo "::error::ads.txt does not contain a valid Google publisher record"; exit 1
          }
          echo "ads.txt: $(cat out/ads.txt)"

      - name: Check for broken internal links
        run: node scripts/check-links.mjs

      - name: SEO audit
        run: node scripts/seo-audit.mjs

      # ---------------------------------------------------------------- upload
      # FTP to shared hosting is not always reliable with several thousand small
      # files. The retry runs only if the first attempt fails, and resumes from
      # the server-side state file rather than re-uploading everything.
      - name: Deploy to Hostinger
        id: deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/
          timeout: 120000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Retry deploy once if the first attempt failed
        id: retry
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/
          timeout: 120000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # ------------------------------------------------------------- verify it
      # This step, not the FTP exit code, decides whether the deploy worked.
      # The action against this host reports failure while still delivering the
      # files, so trusting its exit code produced both false alarms and, worse,
      # skipped the only check that looks at reality.
      - name: Verify the live site matches this build
        if: always()
        run: |
          sleep 20
          fail=0
          for p in / /sitemap.xml /robots.txt /feed.xml /llms.txt /glossary/ /newsroom/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://tradingnewsglobal.com${p}?cb=${RANDOM}" || echo 000)
            if [ "$code" != "200" ]; then
              echo "::error::${p} returned ${code}"
              fail=1
            else
              echo "ok   ${p}"
            fi
          done

          # Fetch machine-read files on the BARE url, exactly as a crawler does.
          # Checking with a cache-busting query string tests a path no crawler
          # uses and hides a stale CDN copy.
          adslive=$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' "https://tradingnewsglobal.com/ads.txt" || echo "")
          adsbuilt=$(cat out/ads.txt)
          if [ "$adslive" != "$adsbuilt" ]; then
            echo "::warning::live ads.txt differs from the build (likely CDN cache, clears within 5 minutes)"
            echo "  live:  $adslive"
            echo "  built: $adsbuilt"
          else
            echo "ok   ads.txt matches the build"
          fi

          live=$(curl -sS --max-time 20 "https://tradingnewsglobal.com/sitemap.xml?cb=${RANDOM}" | grep -c '<loc>' || echo 0)
          built=$(grep -c '<loc>' out/sitemap.xml)
          echo "sitemap URLs — live: ${live}, built: ${built}"
          if [ "$live" != "$built" ]; then
            echo "::error::live sitemap has ${live} URLs but this build has ${built} — the upload is incomplete"
            fail=1
          fi

          exit $fail

      - name: Notify IndexNow (Bing, Yandex, Seznam, Naver)
        # Never fails the deploy — a rejected ping is not a broken release.
        if: success()
        continue-on-error: true
        run: node scripts/indexnow.mjs
