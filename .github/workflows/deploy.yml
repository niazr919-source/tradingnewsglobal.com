# Build the static export and publish it to Hostinger over FTP.
#
# One-time setup - GitHub repo > Settings > Secrets and variables > Actions:
#   FTP_SERVER    ftp.tradingnewsglobal.com   (hPanel > Files > FTP Accounts)
#   FTP_USERNAME  u123456789.deploy
#   FTP_PASSWORD  the FTP account password
#
# Hostinger serves from public_html/ - that is the server-dir below.

name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  # Deliberately NOT cancel-in-progress. Cancelling a run mid-FTP-transfer
  # leaves a partial upload and an inconsistent sync-state file on the server,
  # which then breaks the following deploy too. Queue instead.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://tradingnewsglobal.com

      - name: Verify the export looks complete
        run: |
          for f in index.html sitemap.xml robots.txt .htaccess feed.xml llms.txt 404.html; do
            test -f "out/$f" || { echo "::error::missing out/$f"; exit 1; }
          done
          echo "Exported $(find out -name '*.html' | wc -l) HTML pages, $(du -sh out | cut -f1)"

      - name: Validate ads.txt
        # ads.txt is machine-parsed by AdSense and by programmatic buyers, so a
        # stray non-ASCII byte or a CR is an avoidable way to fail a parser.
        # `od -c` renders a carriage return as the two characters \r, which lets
        # this test for one without embedding a control character in this file.
        run: |
          if LC_ALL=C grep -q '[^ -~]' out/ads.txt; then
            echo "::error::ads.txt contains non-ASCII bytes"
            exit 1
          fi
          if od -c out/ads.txt | grep -q '\\r'; then
            echo "::error::ads.txt has CRLF line endings, expected LF"
            exit 1
          fi
          if ! grep -qE '^google\.com, pub-[0-9]{16}, DIRECT, f08c47fec0942fa0$' out/ads.txt; then
            echo "::error::ads.txt has no valid Google publisher record"
            exit 1
          fi
          echo "ads.txt ok: $(cat out/ads.txt)"

      - name: Check for broken internal links
        run: node scripts/check-links.mjs

      - name: SEO audit
        run: node scripts/seo-audit.mjs

      # FTP to shared hosting is not reliable with several thousand small files.
      # This host's action reports failure while still delivering every file, so
      # its exit code is not a usable signal. Both attempts are non-fatal and the
      # live check below is the real gate.
      - name: Deploy to Hostinger
        id: deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/
          timeout: 120000
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Retry deploy once if the first attempt failed
        if: steps.deploy.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/
          timeout: 120000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # This step, not the FTP exit code, decides whether the deploy worked.
      # It retries because the CDN needs a little time to pick up new files, and
      # a check that fires once immediately after upload reports a false alarm.
      # Machine-read files are fetched on the bare URL, exactly as a crawler
      # does - a cache-busting query string tests a path no crawler uses and
      # hides a stale CDN copy.
      - name: Verify the live site matches this build
        if: always()
        run: |
          built=$(grep -c '<loc>' out/sitemap.xml)
          echo "build has ${built} sitemap URLs"

          for attempt in $(seq 1 10); do
            fail=0

            for p in / /sitemap.xml /robots.txt /feed.xml /llms.txt /glossary/ /newsroom/ /ads.txt; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H 'Cache-Control: no-cache' "https://tradingnewsglobal.com${p}" || echo 000)
              [ "$code" = "200" ] || { echo "attempt ${attempt}: ${p} returned ${code}"; fail=1; }
            done

            live=$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' "https://tradingnewsglobal.com/sitemap.xml" | grep -c '<loc>' || echo 0)
            [ "$live" = "$built" ] || { echo "attempt ${attempt}: live sitemap has ${live} URLs, expected ${built}"; fail=1; }

            if [ "$fail" = "0" ]; then
              echo "live site matches this build (attempt ${attempt})"
              exit 0
            fi

            sleep 40
          done

          echo "::error::live site still does not match this build after 10 attempts over ~7 minutes"
          exit 1

      - name: Notify IndexNow (Bing, Yandex, Seznam, Naver)
        if: success()
        continue-on-error: true
        run: node scripts/indexnow.mjs
